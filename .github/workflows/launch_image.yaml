name: Launch Image

# ปล่อย image เวอร์ชันที่เลือกเองเข้าเครื่องที่กำลังรันอยู่ — ใช้ตอนอยากย้อนกลับ (rollback)
# หรืออยากปล่อย tag ที่ไม่ใช่ตัวล่าสุด ปกติ CI ของ repo prod-pai-todolist ทำขั้นนี้ให้เองแล้ว
#
# กลไกคือ "ป้ายประกาศ + สะกิด" ไม่แตะ Terraform และไม่แตะ launch template:
#   1. เปลี่ยนค่าใน SSM Parameter Store ให้เป็น tag ใหม่
#   2. สั่ง start-instance-refresh ให้ ASG ทยอยสลับเครื่อง
# เครื่องใหม่บูตขึ้นมาอ่าน tag จาก SSM แล้ว docker pull ตัวนั้นมารัน
#
# ไม่มีคำสั่งลบหรือสร้าง resource ใดๆ ในไฟล์นี้ การวาง topology เป็นของ Infra Setup

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "tag ของ image ใน ECR ที่จะปล่อย (commit SHA จาก CI ของแอป หรือ latest)"
        required: true
        type: string
      wait:
        description: "รอจน instance refresh เสร็จ"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prodpai-rollout
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # ชื่อ ECR อ่านจาก .github/config.env (ดู step Load shared config)
  IMAGE_TAG_PARAM: /prod-pai/app/image_tag
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  roll:
    name: Roll the image into the ASG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # checkout มาแค่เพื่ออ่าน .github/config.env ไม่มีการ build หรือแก้ไฟล์ใดๆ
      - name: Checkout
        uses: actions/checkout@v4

      # ชื่อ bucket / ECR ของ account นี้อยู่ที่ .github/config.env ที่เดียว
      # ส่งต่อให้ step ถัดไป (env) และให้ Terraform (TF_VAR_*) ในทีเดียว
      - name: Load shared config
        run: |
          grep -E '^[A-Z_]+=' .github/config.env | tr -d '\r' > "$RUNNER_TEMP/config.env"
          set -a; . "$RUNNER_TEMP/config.env"; set +a
          for key in TF_STATE_BUCKET DATA_BUCKET APP_ECR_REPOSITORY DASHBOARD_ECR_REPOSITORY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is missing from .github/config.env"
              exit 1
            fi
          done
          {
            cat "$RUNNER_TEMP/config.env"
            echo "TF_VAR_data_bucket=$DATA_BUCKET"
            echo "TF_VAR_app_ecr_repository=$APP_ECR_REPOSITORY"
            echo "TF_VAR_dashboard_ecr_repository=$DASHBOARD_ECR_REPOSITORY"
          } >> "$GITHUB_ENV"
          echo "state: s3://$TF_STATE_BUCKET  data: s3://$DATA_BUCKET  ecr: $APP_ECR_REPOSITORY, $DASHBOARD_ECR_REPOSITORY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # เครื่องใหม่จะ pull tag นี้ตอนบูต ถ้าไม่มีจริงจะบูตขึ้นมาแบบไม่มีแอปทั้งชุด
      - name: Check image exists in ECR
        run: |
          if ! aws ecr describe-images --repository-name "$APP_ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$APP_ECR_REPOSITORY:$IMAGE_TAG is not in ECR"
            exit 1
          fi

      - name: Find the ASG
        id: find
        run: |
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'prod-pai-env-asg')].AutoScalingGroupName | [0]" \
            --output text)
          if [ "$asg" = "None" ] || [ -z "$asg" ]; then
            echo "::error::ไม่พบ ASG — ต้องรัน Infra Setup ก่อน"
            exit 1
          fi
          echo "asg=$asg" >> "$GITHUB_OUTPUT"
          echo "ASG=$asg"

      # ยิงรอบใหม่ทับรอบที่ยังไม่จบจะโดนปฏิเสธ แล้วเครื่องจะค้างคาอยู่ครึ่งทาง
      - name: Wait for any running refresh to finish
        run: |
          for i in $(seq 1 40); do
            status=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ steps.find.outputs.asg }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            case "$status" in
              Pending|InProgress|Cancelling) echo "  รอรอบก่อนหน้า ($status)"; sleep 30 ;;
              *) echo "ว่างแล้ว (ล่าสุด: $status)"; exit 0 ;;
            esac
          done
          echo "::error::รอรอบก่อนหน้าไม่จบภายในเวลา"
          exit 1

      # 1. เปลี่ยนป้ายประกาศ
      - name: Update the image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "$IMAGE_TAG_PARAM" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite >/dev/null
          echo "✅ $IMAGE_TAG_PARAM = $IMAGE_TAG"

      # 2. สะกิด ASG ให้ทยอยสลับเครื่อง (Rolling, min healthy 50%, warmup 180 วินาที)
      - name: Trigger the rolling instance refresh
        run: |
          id=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.find.outputs.asg }}" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}' \
            --query InstanceRefreshId --output text)
          echo "✅ instance refresh $id เริ่มแล้ว"

      - name: Wait for the refresh to finish
        if: ${{ inputs.wait }}
        run: |
          asg="${{ steps.find.outputs.asg }}"
          for i in $(seq 1 60); do
            info=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
                     --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)
            status=$(echo "$info" | awk '{print $1}')
            pct=$(echo "$info" | awk '{print $2}')
            echo "  $status ${pct}%"
            case "$status" in
              Successful) echo "เครื่องทุกตัวรัน $IMAGE_TAG แล้ว"; exit 0 ;;
              Failed|Cancelled) echo "::error::instance refresh $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::warning::รอครบเวลาแล้วแต่ refresh ยังไม่จบ ไปดูต่อที่ ASG → Instance refresh"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Launch image"
            echo ""
            echo "- Image: \`$APP_ECR_REPOSITORY:$IMAGE_TAG\`"
            echo "- SSM: \`$IMAGE_TAG_PARAM\`"
            echo "- ASG: \`${{ steps.find.outputs.asg }}\`"
            echo ""
            echo "ASG ทยอยสลับเครื่องเองแบบ rolling เครื่องใหม่อ่าน tag จาก SSM ตอนบูต"
            echo "ไม่มีการแก้ launch template และไม่มีการลบ-สร้างทั้งชุด"
          } >> "$GITHUB_STEP_SUMMARY"
