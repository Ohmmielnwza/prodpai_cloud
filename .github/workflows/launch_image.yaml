name: Launch Image

# ใช้เมื่อ CI ของ repo prod-pai-todolist ดัน image ใหม่ขึ้น ECR เรียบร้อยแล้ว
#
# หน้าที่เดียวของ workflow นี้คือ "บอก ASG ว่ามีของใหม่" แล้วปล่อยให้ ASG ทยอยเปลี่ยน
# เครื่องเอง (instance_refresh แบบ Rolling, min_healthy_percentage 50, warmup 180 วินาที
# ตั้งไว้แล้วใน ec2.tf) จึงไม่มีคำสั่ง terminate หรือสร้างเครื่องใหม่อยู่ในไฟล์นี้เลย
#
# ลำดับที่ถูกต้อง: Infra Setup ต้องเคยรันแล้ว (ต้องมี ASG + launch template อยู่ก่อน)
# การเรียงลำดับเป็นหน้าที่คนกด ไม่ได้ผูกเงื่อนไขอัตโนมัติไว้

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "tag ของ image ใน ECR ที่จะปล่อย (commit SHA จาก CI ของแอป)"
        required: true
        type: string
      wait:
        description: "รอจน instance refresh เสร็จ"
        type: boolean
        default: true

permissions:
  contents: read

# คนละกลุ่มกับ terraform เพราะไม่ได้แตะ state แต่กันตัวเองซ้อนกันเอง
concurrency:
  group: prodpai-launch-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: plodphai-todo-list
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  roll:
    name: Roll new image into the ASG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check image exists in ECR
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$ECR_REPOSITORY:$IMAGE_TAG is not in ECR"
            exit 1
          fi

      - name: Find ASG and launch template
        id: find
        run: |
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'prod-pai-env-asg')].AutoScalingGroupName | [0]" \
            --output text)
          if [ "$asg" = "None" ] || [ -z "$asg" ]; then
            echo "::error::ไม่พบ ASG — ต้องรัน Infra Setup ก่อน"
            exit 1
          fi
          lt=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$asg" \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' --output text)
          echo "asg=$asg" >> "$GITHUB_OUTPUT"
          echo "lt=$lt" >> "$GITHUB_OUTPUT"
          echo "ASG=$asg  LaunchTemplate=$lt"

      # ถ้ามีรอบเก่าค้างอยู่ การยิงรอบใหม่จะโดนปฏิเสธ แล้วเครื่องจะค้างคาอยู่ครึ่งทาง
      - name: Refuse to overlap a running refresh
        run: |
          status=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${{ steps.find.outputs.asg }}" \
            --query 'InstanceRefreshes[0].Status' --output text)
          echo "refresh ล่าสุด: $status"
          case "$status" in
            Pending|InProgress|Cancelling)
              echo "::error::มี instance refresh ค้างอยู่ ($status) รอให้จบก่อน"
              exit 1 ;;
          esac

      # สร้าง launch template version ใหม่โดยเปลี่ยนเฉพาะ user_data ที่ฝัง IMAGE_TAG
      # ยึด AMI และค่าอื่นจาก version ล่าสุด เพื่อไม่ให้ของอื่นเปลี่ยนไปด้วย
      - name: Create launch template version with the new tag
        id: ltv
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          ecr_url="$registry/$ECR_REPOSITORY"

          sed -e "s|\${IMAGE_TAG}|$IMAGE_TAG|g" -e "s|\${ECR_URL}|$ecr_url|g" \
            scripts/userdata.sh > /tmp/userdata.sh
          base64 -w0 /tmp/userdata.sh > /tmp/userdata.b64

          version=$(aws ec2 create-launch-template-version \
            --launch-template-id "${{ steps.find.outputs.lt }}" \
            --source-version '$Latest' \
            --version-description "image $IMAGE_TAG" \
            --launch-template-data "{\"UserData\":\"$(cat /tmp/userdata.b64)\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' --output text)

          aws ec2 modify-launch-template \
            --launch-template-id "${{ steps.find.outputs.lt }}" \
            --default-version "$version" >/dev/null

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "สร้าง launch template version $version แล้ว"

      # ASG ตั้ง triggers = ["tag"] ไว้ การเขียน tag ใหม่จึงเป็นสัญญาณให้เริ่ม rolling refresh
      - name: Tag the ASG to trigger the rolling refresh
        run: |
          aws autoscaling create-or-update-tags --tags \
            "ResourceId=${{ steps.find.outputs.asg }},ResourceType=auto-scaling-group,Key=ImageTag,Value=$IMAGE_TAG,PropagateAtLaunch=true"
          echo "ติด tag ImageTag=$IMAGE_TAG แล้ว ASG จะทยอยเปลี่ยนเครื่องเอง"

      - name: Wait for the refresh to finish
        if: ${{ inputs.wait }}
        run: |
          asg="${{ steps.find.outputs.asg }}"
          for i in $(seq 1 60); do
            info=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
                     --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)
            status=$(echo "$info" | awk '{print $1}')
            pct=$(echo "$info" | awk '{print $2}')
            echo "  $status ${pct}%"
            case "$status" in
              Successful) echo "refresh เสร็จแล้ว"; exit 0 ;;
              Failed|Cancelled) echo "::error::instance refresh $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::warning::รอครบเวลาแล้วแต่ refresh ยังไม่จบ ไปดูต่อที่ console ได้"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Launch image"
            echo ""
            echo "- Image: \`$ECR_REPOSITORY:$IMAGE_TAG\`"
            echo "- ASG: \`${{ steps.find.outputs.asg }}\`"
            echo "- Launch template version: \`${{ steps.ltv.outputs.version }}\`"
            echo ""
            echo "ASG ทยอยเปลี่ยนเครื่องเองแบบ rolling ไม่มีการลบแล้วสร้างใหม่ทั้งชุด"
          } >> "$GITHUB_STEP_SUMMARY"
