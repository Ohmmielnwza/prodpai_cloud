name: Launch Image

# ปล่อย image เวอร์ชันที่เลือกเองเข้าเครื่องที่กำลังรันอยู่ — ใช้ตอนอยากย้อนกลับ (rollback)
# หรืออยากปล่อย tag ที่ไม่ใช่ตัวล่าสุด ปกติ CI ของ repo prod-pai-todolist ทำขั้นนี้ให้เองแล้ว
#
# กลไกคือ "ป้ายประกาศ + สะกิด" ไม่แตะ Terraform และไม่แตะ launch template:
#   1. เปลี่ยนค่าใน SSM Parameter Store ให้เป็น tag ใหม่
#   2. ทยอยเปลี่ยนเครื่องใน ASG ด้วย scripts/rollout_asg.sh (เปิดใหม่ก่อน ปิดเก่าทีหลัง)
#      ไม่ใช้ start-instance-refresh เพราะบัญชี AWS Academy มี SCP deny คำสั่งนั้นไว้
# เครื่องใหม่บูตขึ้นมาอ่าน tag จาก SSM แล้ว docker pull ตัวนั้นมารัน
#
# ไม่มีคำสั่งลบหรือสร้าง resource ใดๆ ในไฟล์นี้ การวาง topology เป็นของ Infra Setup

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "tag ของ image ใน ECR ที่จะปล่อย (commit SHA จาก CI ของแอป หรือ latest)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prodpai-rollout
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # ชื่อ ECR อ่านจาก .github/config.env (ดู step Load shared config)
  IMAGE_TAG_PARAM: /prod-pai/app/image_tag
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  roll:
    name: Roll the image into the ASG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # checkout มาแค่เพื่ออ่าน .github/config.env ไม่มีการ build หรือแก้ไฟล์ใดๆ
      - name: Checkout
        uses: actions/checkout@v4

      # ชื่อ bucket / ECR ของ account นี้อยู่ที่ .github/config.env ที่เดียว
      # ส่งต่อให้ step ถัดไป (env) และให้ Terraform (TF_VAR_*) จากค่าชุดเดียวกัน
      - name: Load shared config
        run: |
          # ตัด BOM (Notepad ใส่ให้) กับ CR (ไฟล์ที่ save บน Windows) ออกก่อน
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' .github/config.env > "$RUNNER_TEMP/config.env"
          if grep -nE '^[A-Z_]+[[:space:]]+=' "$RUNNER_TEMP/config.env"; then
            echo "::error::.github/config.env ห้ามเว้นวรรครอบเครื่องหมาย = (เขียนเป็น KEY=value)"
            exit 1
          fi
          set -a; . "$RUNNER_TEMP/config.env"; set +a
          for key in TF_STATE_BUCKET DATA_BUCKET APP_ECR_REPOSITORY DASHBOARD_ECR_REPOSITORY; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::error::$key is missing from .github/config.env"
              exit 1
            fi
            # ชื่อ S3 / ECR ใช้ได้แค่ตัวเล็ก ตัวเลข . - _ (กันเครื่องหมายคำพูดหรือคอมเมนต์หลุดเข้ามาในชื่อ)
            if ! [[ "$value" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "::error::$key='$value' ไม่ใช่ชื่อ bucket/ECR ที่ถูกต้อง (ใช้ได้แค่ a-z 0-9 . - _)"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          {
            echo "TF_VAR_data_bucket=$DATA_BUCKET"
            echo "TF_VAR_app_ecr_repository=$APP_ECR_REPOSITORY"
            echo "TF_VAR_dashboard_ecr_repository=$DASHBOARD_ECR_REPOSITORY"
          } >> "$GITHUB_ENV"
          echo "state: s3://$TF_STATE_BUCKET  data: s3://$DATA_BUCKET  ecr: $APP_ECR_REPOSITORY, $DASHBOARD_ECR_REPOSITORY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # เครื่องใหม่จะ pull tag นี้ตอนบูต ถ้าไม่มีจริงจะบูตขึ้นมาแบบไม่มีแอปทั้งชุด
      - name: Check image exists in ECR
        run: |
          if ! aws ecr describe-images --repository-name "$APP_ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$APP_ECR_REPOSITORY:$IMAGE_TAG is not in ECR"
            exit 1
          fi

      - name: Find the ASG
        id: find
        run: |
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'prod-pai-env-asg')].AutoScalingGroupName | [0]" \
            --output text)
          if [ "$asg" = "None" ] || [ -z "$asg" ]; then
            echo "::error::ไม่พบ ASG — ต้องรัน Infra Setup ก่อน"
            exit 1
          fi
          echo "asg=$asg" >> "$GITHUB_OUTPUT"
          echo "ASG=$asg"

      # ถ้า ASG ยังเปิด/ปิดเครื่องค้างอยู่ (rollout รอบก่อน, scaling, เปลี่ยนเครื่องที่ป่วย)
      # รอให้นิ่งก่อน ไม่งั้นการนับเครื่องเก่า/ใหม่ใน rollout_asg.sh จะคลาดเคลื่อน
      - name: Wait for the ASG to settle
        run: |
          asg="${{ steps.find.outputs.asg }}"
          for i in $(seq 1 40); do
            read -r desired inservice total <<<"$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$asg" \
              --query 'AutoScalingGroups[0].[DesiredCapacity,length(Instances[?LifecycleState==`InService`]),length(Instances)]' \
              --output text)"
            if [ "$inservice" = "$desired" ] && [ "$total" = "$desired" ]; then
              echo "นิ่งแล้ว: $inservice/$desired InService"
              exit 0
            fi
            echo "  รอ ASG นิ่ง ($inservice InService, $total ทั้งหมด, desired $desired)"
            sleep 30
          done
          echo "::error::ASG ไม่นิ่งภายในเวลา"
          exit 1

      # 1. เปลี่ยนป้ายประกาศ
      - name: Update the image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "$IMAGE_TAG_PARAM" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite >/dev/null
          echo "✅ $IMAGE_TAG_PARAM = $IMAGE_TAG"

      # 2. ทยอยเปลี่ยนเครื่อง: เปิดเครื่องใหม่ (อ่าน tag ใหม่จาก SSM) ให้ healthy ก่อน
      #    แล้วค่อยปิดเครื่องเก่าทีละตัว ถ้าเครื่องใหม่ไม่ healthy จะหยุดโดยไม่แตะเครื่องเก่า
      - name: Roll the instances
        run: bash scripts/rollout_asg.sh "${{ steps.find.outputs.asg }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Launch image"
            echo ""
            echo "- Image: \`$APP_ECR_REPOSITORY:$IMAGE_TAG\`"
            echo "- SSM: \`$IMAGE_TAG_PARAM\`"
            echo "- ASG: \`${{ steps.find.outputs.asg }}\`"
            echo ""
            echo "เปิดเครื่องใหม่ก่อนแล้วปิดเครื่องเก่าทีละตัว เครื่องใหม่อ่าน tag จาก SSM ตอนบูต"
            echo "ไม่มีการแก้ launch template และไม่มีการลบ-สร้างทั้งชุด"
          } >> "$GITHUB_STEP_SUMMARY"
