  name: CI Pipeline

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
    workflow_dispatch:
  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Run tests
          run: |
            python -m pytest scripts/test_app.py

    security:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Run Semgrep
          uses: semgrep/semgrep-action@v1
          with:
            config: >-
              p/python

        - name: Run Trivy vulnerability scanner
          uses: aquasecurity/trivy-action@master
          with:
            scan-type: fs
            scan-ref: .
            format: table

    build-and-push:
      needs: [test, security]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: us-east-1

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Flask image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: prodpai_cloud
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build \
              -f app/Dockerfile \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        - name: Run Trivy vulnerability scanner on image
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: '${{ steps.login-ecr.outputs.registry }}/prodpai_cloud:${{ github.sha }}'
            format: 'table'
            exit-code: '0' 
            ignore-unfixed: true
            severity: 'CRITICAL,HIGH'

        - name: Push Flask image to ECR
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: prodpai_cloud
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    terraform-deploy:
      needs: [build-and-push]
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: us-east-1

        - name: Set Up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.9.8

        - name: Clean Terraform Cache
          run: rm -rf .terraform .terraform.lock.hcl

        - name: Terraform Init
          run: terraform init -upgrade

        - name: Terraform Apply
          run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"