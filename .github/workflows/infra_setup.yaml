name: Infra Setup

# วาง topology ทั้งหมดลง AWS: VPC, subnet, NAT, ALB + listener rule, ASG,
# Lambda (quarantine + aggregator), S3 endpoint และเครื่อง dashboard ใน private subnet
#
# รันด้วยมือโดยเจ้าของบัญชี AWS เท่านั้น ไม่ผูกกับ push เพราะ apply ทุก push
# แปลว่าใครกด merge ก็แก้ production ได้
#
# ของที่ workflow นี้ "ไม่" ทำ: build image ของแอป todo-list — นั่นเป็นหน้าที่ CI
# ของ repo prod-pai-todolist ส่วนการทยอยอัปเดตเครื่องเมื่อมี image ใหม่อยู่ที่ launch_image.yaml

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "tag ของ image แอป todo-list ใน ECR (commit SHA จาก CI ของแอป หรือ latest)"
        type: string
        default: latest
      skip_dashboard_build:
        description: "ข้ามการ build image ของ dashboard (ใช้ตัวที่อยู่ใน ECR อยู่แล้ว)"
        type: boolean
        default: false
      allow_reapply:
        description: "ยืนยันว่าตั้งใจ apply ทับของที่ยังอยู่ (อ่านคำเตือนใน README ก่อน)"
        type: boolean
        default: false

permissions:
  contents: read

# กลุ่มเดียวกับ destroy.yml เพื่อไม่ให้ apply กับ destroy ทำงานพร้อมกัน
concurrency:
  group: prodpai-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # ชื่อ bucket และ ECR อ่านจาก .github/config.env (ดู step Load shared config)
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ชื่อ bucket / ECR ของ account นี้อยู่ที่ .github/config.env ที่เดียว
      # ส่งต่อให้ step ถัดไป (env) และให้ Terraform (TF_VAR_*) จากค่าชุดเดียวกัน
      - name: Load shared config
        run: |
          # ตัด BOM (Notepad ใส่ให้) กับ CR (ไฟล์ที่ save บน Windows) ออกก่อน
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' .github/config.env > "$RUNNER_TEMP/config.env"
          if grep -nE '^[A-Z_]+[[:space:]]+=' "$RUNNER_TEMP/config.env"; then
            echo "::error::.github/config.env ห้ามเว้นวรรครอบเครื่องหมาย = (เขียนเป็น KEY=value)"
            exit 1
          fi
          set -a; . "$RUNNER_TEMP/config.env"; set +a
          for key in TF_STATE_BUCKET DATA_BUCKET APP_ECR_REPOSITORY DASHBOARD_ECR_REPOSITORY; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::error::$key is missing from .github/config.env"
              exit 1
            fi
            # ชื่อ S3 / ECR ใช้ได้แค่ตัวเล็ก ตัวเลข . - _ (กันเครื่องหมายคำพูดหรือคอมเมนต์หลุดเข้ามาในชื่อ)
            if ! [[ "$value" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "::error::$key='$value' ไม่ใช่ชื่อ bucket/ECR ที่ถูกต้อง (ใช้ได้แค่ a-z 0-9 . - _)"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          {
            echo "TF_VAR_data_bucket=$DATA_BUCKET"
            echo "TF_VAR_app_ecr_repository=$APP_ECR_REPOSITORY"
            echo "TF_VAR_dashboard_ecr_repository=$DASHBOARD_ECR_REPOSITORY"
          } >> "$GITHUB_ENV"
          echo "state: s3://$TF_STATE_BUCKET  data: s3://$DATA_BUCKET  ecr: $APP_ECR_REPOSITORY, $DASHBOARD_ECR_REPOSITORY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ถ้า image ที่ขอไม่มีจริง ASG จะปั้นเครื่องที่ pull ไม่ขึ้นมาทั้งชุด ตรวจก่อนดีกว่า
      - name: Check application image exists in ECR
        run: |
          if ! aws ecr describe-images --repository-name "$APP_ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$APP_ECR_REPOSITORY:$IMAGE_TAG is not in ECR (wait for the app's CI to push it)"
            exit 1
          fi

      # apply รอบสองจะสร้าง builder ใหม่แล้ว "ลบ AMI ตัวที่ launch template ใช้อยู่"
      # ผลคือ ASG ปั้นเครื่องใหม่ไม่ได้อีกเลย อยากเปลี่ยนเป็น image ใหม่ให้ใช้ Launch Image แทน
      - name: Refuse to re-apply over a live stack
        if: ${{ !inputs.allow_reapply }}
        run: |
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'prod-pai-env-asg')].AutoScalingGroupName | [0]" \
            --output text)
          if [ "$asg" != "None" ] && [ -n "$asg" ]; then
            echo "::error::มี stack อยู่แล้ว ($asg) — ถ้าจะเปลี่ยน image ให้รัน Launch Image แทน. ถ้าตั้งใจ apply ทับจริงให้ติ๊ก allow_reapply"
            exit 1
          fi

      # bucket นี้ตั้งใจสร้างนอก Terraform เพราะต้องอยู่รอดจาก destroy
      - name: Ensure dashboard data bucket exists
        run: |
          bucket="$DATA_BUCKET"
          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "Creating s3://$bucket"
            aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            aws s3api put-public-access-block --bucket "$bucket" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # หน้า dashboard อยู่ใน repo นี้ เครื่อง dashboard จึง pull image จาก ECR ตัวนี้
      - name: Build and push dashboard image
        if: ${{ !inputs.skip_dashboard_build }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names "$DASHBOARD_ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$DASHBOARD_ECR_REPOSITORY" >/dev/null
          docker build -f dashboard/Dockerfile \
            -t "$REGISTRY/$DASHBOARD_ECR_REPOSITORY:$TAG" \
            -t "$REGISTRY/$DASHBOARD_ECR_REPOSITORY:latest" ./dashboard
          docker push "$REGISTRY/$DASHBOARD_ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$DASHBOARD_ECR_REPOSITORY:latest"

      - name: Scan dashboard image
        if: ${{ !inputs.skip_dashboard_build }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.DASHBOARD_ECR_REPOSITORY }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive
          # bucket ของ state ต้องมีอยู่ก่อน Terraform ไม่สร้างให้
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "::error::state bucket s3://$TF_STATE_BUCKET ไม่มีหรือไม่ใช่ของ account นี้ (แก้ TF_STATE_BUCKET ใน .github/config.env)"
            exit 1
          fi
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform validate

      # remote-exec ssh จาก runner ตัวนี้เข้า builder จึงเปิด SSH ให้แค่ IP ของ runner
      # ค่าที่ได้คือ IP ขาออกของ runner และใช้ได้จนจบ job นี้
      - name: Terraform plan
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if ! echo "$runner_ip" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "::error::อ่าน IP ของ runner ไม่ได้ ($runner_ip)"
            exit 1
          fi
          echo "builder SSH เปิดให้ $runner_ip/32 เท่านั้น"
          terraform plan -input=false -out=tfplan \
            -var="image_tag=$IMAGE_TAG" \
            -var="dashboard_image_tag=${{ github.sha }}" \
            -var="builder_ssh_cidrs=[\"$runner_ip/32\"]"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      # apply จบไม่ได้แปลว่าเว็บขึ้น ต้องเห็น target เขียวจริงถึงจะเรียกว่า deploy สำเร็จ
      - name: Wait for targets to become healthy
        run: |
          for tg in $(aws elbv2 describe-target-groups \
                        --query "TargetGroups[?starts_with(TargetGroupName, 'prod-pai') || starts_with(TargetGroupName, 'dashboard')].TargetGroupArn" \
                        --output text); do
            echo "waiting for $tg"
            for i in $(seq 1 40); do
              states=$(aws elbv2 describe-target-health --target-group-arn "$tg" \
                        --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
              echo "  $states"
              # เทียบทั้งบรรทัด (-x) เพราะคำว่า "unhealthy" มี "healthy" อยู่ข้างใน
              # ถ้าเทียบแบบ grep ธรรมดา target ที่ unhealthy ทุกตัวจะถูกนับว่าผ่าน
              if [ -n "$states" ] && ! echo "$states" | tr '\t' '\n' | grep -qvx healthy; then
                echo "  healthy ครบแล้ว"
                continue 2
              fi
              sleep 15
            done
            echo "::error::$tg ยังไม่ healthy ครบภายใน 10 นาที"
            exit 1
          done

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Application: $(terraform output -raw app_url)"
            echo "- Dashboard: $(terraform output -raw dashboard_url)"
            echo "- Data: $(terraform output -raw dashboard_data_location)"
            echo ""
            echo "มี image ใหม่ของแอปเมื่อไหร่ ให้รัน **Launch Image** ด้วย tag นั้น ไม่ต้องรัน workflow นี้ซ้ำ"
          } >> "$GITHUB_STEP_SUMMARY"
